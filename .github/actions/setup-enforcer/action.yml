name: Setup Enforcer CI
description: Install the pinned Node and Rust runtimes plus locked repository dependencies.
inputs:
  install-node:
    description: Install Node and npm dependencies.
    required: false
    default: 'true'
  install-policy-tools:
    description: Install the pinned cargo-audit and cargo-deny binaries.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      if: inputs.install-node == 'true'
      with:
        node-version: 22.22.2
        cache: npm
    - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      with:
        toolchain: 1.95.0
        components: rustfmt, clippy
    - name: Select the repository npm version
      if: inputs.install-node == 'true'
      shell: bash
      run: npm install --global npm@11.7.0
    - name: Install locked Node dependencies
      if: inputs.install-node == 'true'
      shell: bash
      run: npm ci
    - name: Cache pinned dependency-policy tools
      if: inputs.install-policy-tools == 'true'
      id: policy-tools-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ runner.temp }}/enforcer-policy-tools
        key: ${{ runner.os }}-rust-1.95.0-policy-tools-cargo-audit-0.22.2-cargo-deny-0.20.2
    - name: Install pinned dependency-policy tools
      if: inputs.install-policy-tools == 'true' && steps.policy-tools-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        CARGO_INSTALL_ROOT: ${{ runner.temp }}/enforcer-policy-tools
      run: |
        cargo install cargo-audit --version 0.22.2 --locked
        cargo install cargo-deny --version 0.20.2 --locked
    - name: Expose dependency-policy tools
      if: inputs.install-policy-tools == 'true'
      shell: bash
      run: echo "${{ runner.temp }}/enforcer-policy-tools/bin" >> "$GITHUB_PATH"
