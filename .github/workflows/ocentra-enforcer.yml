name: Enforcer Manual Parity

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Manual parity is diagnostic but expensive; only the newest push on a
  # branch should consume a runner or hold the release handoff queue.
  group: enforcer-manual-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-parity:
    name: Exact local parity diagnostic
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: ocentra/ocentra-enforcer/.github/actions/setup-enforcer@af07cdf5f4b12a874c68346e9aa9e902fe6b6a4c
        with:
          install-policy-tools: 'true'
      - name: Deterministic dependency bootstrap
        run: npm ci
      - name: Run the developer gate unchanged
        run: npm run ci:local
