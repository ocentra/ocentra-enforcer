name: Enforcer Manual Parity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-parity:
    name: Exact local parity diagnostic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ./.github/actions/setup-enforcer
        with:
          install-policy-tools: 'true'
      - name: Run the developer gate unchanged
        run: npm run ci:local
