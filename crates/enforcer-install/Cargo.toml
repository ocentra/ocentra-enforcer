[package]
name = "enforcer-install"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "arc-23 multi-harness installer SKELETON: harness-neutral install/uninstall/update/doctor core, the HarnessAdapter trait (plan/apply/verify), report types, managed-block/backup helpers, the CLI contract seam (--scope user|project, default user/global, --dry-run), and the platform binary distribution/download path. Hosts the Track C per-harness adapters (c01-c09) and the x03 legacy-name migration, which own specific files under this crate -- disjoint by file, sequenced after this skeleton."
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml_edit = { workspace = true }
enforcer-core = { path = "../enforcer-core", version = "0.1.0" }
enforcer-domain = { path = "../enforcer-domain", version = "0.1.0" }
# c07 deviation (owns: is Cargo.toml-silent, but the workpack binds the
# generic adapter to the x01 MCP server-name const as the single source of
# truth for `mcpServers[<name>]` — never a hardcoded literal). Additive,
# non-conflicting dependency edit; enforcer-mcp does not depend on this
# crate, so no cycle.
enforcer-mcp = { path = "../enforcer-mcp", version = "0.1.0" }

[dev-dependencies]
tempfile = "3"
# c04 (`src/hooks/pretooluse.rs`) integration tests shell out to the REAL
# built `enforcer` binary via Cargo's `CARGO_BIN_EXE_enforcer`, which Cargo
# only sets when the bin's owning crate is a dependency of this crate's own
# test target. `enforcer-cli` does not depend on `enforcer-install` (no
# cycle) -- this is a dev-only, test-scoped edge.
enforcer-cli = { path = "../enforcer-cli", version = "0.1.0" }
# c11's onboarding-skill integration test drives arc-03's 3-layer config
# resolution directly (step 3 of the onboarding procedure) against the
# dogfood/catfood fixtures. Dev-only, test-scoped edge; `enforcer-config`
# does not depend on `enforcer-install` (no cycle).
enforcer-config = { path = "../enforcer-config", version = "0.1.0" }

[lints]
workspace = true
