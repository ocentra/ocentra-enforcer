[package]
name = "enforcer-install"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "arc-23 multi-harness installer SKELETON: harness-neutral install/uninstall/update/doctor core, the HarnessAdapter trait (plan/apply/verify), report types, managed-block/backup helpers, the CLI contract seam (--scope user|project, default user/global, --dry-run), and the platform binary distribution/download path. Hosts the Track C per-harness adapters (c01-c09) and the x03 legacy-name migration, which own specific files under this crate -- disjoint by file, sequenced after this skeleton."
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
enforcer-core = { path = "../enforcer-core", version = "0.1.0" }
enforcer-domain = { path = "../enforcer-domain", version = "0.1.0" }
# c07 deviation (owns: is Cargo.toml-silent, but the workpack binds the
# generic adapter to the x01 MCP server-name const as the single source of
# truth for `mcpServers[<name>]` — never a hardcoded literal). Additive,
# non-conflicting dependency edit; enforcer-mcp does not depend on this
# crate, so no cycle.
enforcer-mcp = { path = "../enforcer-mcp", version = "0.1.0" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
