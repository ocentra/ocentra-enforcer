[package]
name = "enforcer-lang-ts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Per-family Validator implementations for the TypeScript/JavaScript rule family (TS-1..TS-8, 73 rules): source-scan, test-scan, import-boundaries, toolchain, eslint-json, tests, and the TS slice of the shared generic-scanner engine. Built on enforcer-validator's Validator trait and run_fixture_parity harness."
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
enforcer-core = { path = "../enforcer-core", version = "0.1.0" }
enforcer-domain = { path = "../enforcer-domain", version = "0.1.0" }
enforcer-validator = { path = "../enforcer-validator", version = "0.1.0" }

[lints]
workspace = true
