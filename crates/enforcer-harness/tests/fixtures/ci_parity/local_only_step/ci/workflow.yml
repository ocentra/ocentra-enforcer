name: Rust CI

on:
  pull_request:

jobs:
  rust-ci:
    runs-on: ubuntu-latest
    steps:
      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy -D warnings
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace
