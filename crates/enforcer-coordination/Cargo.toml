[package]
name = "enforcer-coordination"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Multi-agent coordination engine for the Ocentra Enforcer workspace: hub/lane/claim/guard/ledger/presence, ported from src/coordination/{vendor/*.js,api.mjs,runner.mjs} with behavior parity (wire-hash canonicalization, 6 lock-conflict classes, protected-singleton escalation, append-only event streams)."
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
# DEPENDENCY-JUSTIFICATION: core execution primitives, canonical domain values,
# durable coordination events, and validator contracts used by hub operations.
enforcer-core = { path = "../enforcer-core", version = "0.1.0" }
enforcer-domain = { path = "../enforcer-domain", version = "0.1.0" }
enforcer-events = { path = "../enforcer-events", version = "0.1.0" }
# DEPENDENCY-JUSTIFICATION: runs the validator during guarded coordination and fix-loop rescans.
enforcer-validator = { path = "../enforcer-validator", version = "0.1.0" }
# DEPENDENCY-JUSTIFICATION: deterministic exact-path and directory expansion
# for claimed ownership sets without widening the root workspace manifest.
glob = "=0.3.3"

[dev-dependencies]
# DEPENDENCY-JUSTIFICATION: isolated filesystem fixtures for coordination
# ledger and lock behavior tests.
tempfile = "=3.27.0"

[lints]
workspace = true
