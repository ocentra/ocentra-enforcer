# `bindings/rust/build.rs` unconditionally passes the GCC/Clang-only
# `-Wno-unused-parameter` flag to its `cc::Build` with no MSVC guard
# (unlike e.g. `tree-sitter-vim`'s own `build.rs` just above, which
# correctly uses `.flag_if_supported(..)` for the identical intent) --
# confirmed by direct inspection of that crate's own downloaded `.crate`
# tarball, and confirmed to actually fail (`cl : Command line error
# D8021: invalid numeric argument '/Wno-unused-parameter'`) via a real
# `cargo build` against this workspace's MSVC toolchain. This is an
# upstream packaging bug specific to that one crate's `build.rs`, NOT a
# tree-sitter ABI incompatibility (that crate's own `[dependencies]`
# `tree-sitter = ">=0.21.0"` requirement has no upper bound, the same
# ABI-range-agnostic shape as `tree-sitter-vim`'s own entry above -- the
# grammar's own generated `parser.c`/`scanner.c` parse correctly once
# compiled through a working `cc::Build` invocation, confirmed by a real
# parse-tree dump against this vendored copy) -- see
# `vendor/tree-sitter-scss-local/src/lib.rs`'s own doc comment for the
# full finding.
tree-sitter-scss-local = { path = "vendor/tree-sitter-scss-local" }
# Language-parity wave G2.3c: Bicep/Nickel/Jsonnet/CFScript structural
# extractors (see languages/generic.rs's `parse_bicep`/`parse_nickel`/
# `parse_jsonnet`/`parse_cfscript`). All four verified end-to-end (real
# parse, no ABI error) against this workspace's `tree-sitter = "0.25"`
# core before being added here, and all four depend on
# `tree-sitter-language` (not `tree-sitter` core) as their runtime
# binding, same ABI-range-agnostic pattern as every grammar above.
# - `tree-sitter-bicep` 1.1.0 (crates.io `repository`:
#   github.com/tree-sitter-grammars/tree-sitter-bicep). Every declaration
#   node kind this row's own `LangSpec::bicep`/`generic::bicep_quirk`
#   care about (`resource_declaration`/`type_declaration`/
#   `module_declaration`/`variable_declaration`/`output_declaration`/
#   `parameter_declaration`) has `"fields": {}` in this grammar's own
#   `node-types.json` (confirmed via both that file and a real parse-tree
#   dump) -- their own names are all positional `identifier` children,
#   not fields; only `user_defined_function` has a real `name` field.
#   This grammar's own root node kind is `infrastructure`, NOT the
#   baseline's own `bicep_module_types`' `"program"` guess -- see
#   `LangSpec::bicep`'s own doc comment for the full corrections.
# - `tree-sitter-nickel` 0.5.0 (crates.io `repository`:
#   github.com/nickel-lang/tree-sitter-nickel -- the language's own
#   official GitHub org). This grammar's root node kind is `term`, NOT
#   the baseline's own `nickel_module_types`' `"source_file"` guess;
#   `applicative` (the baseline's own correctly-identified call-shaped
#   node) is a LEFT-RECURSIVE curried-application chain
#   (`f a b c` = `applicative(t1=applicative(t1=applicative(t1=f,t2=a),
#   t2=b),t2=c)`, confirmed via a real parse-tree dump of a deliberate
#   3-argument call) needing a dedicated chain-walking
#   `generic::nickel_call_override` rather than the generic engine's own
#   flat single-field callee reconstruction -- see `LangSpec::nickel`'s
#   own doc comment for this and the `import`-vs-baseline's-dead-`include`
#   finding.
# - `tree-sitter-jsonnet` 0.0.1 (crates.io `repository`:
#   github.com/deltarocks/tree-sitter-jrsonnet -- published 2026-05-05,
#   the newest grammar dependency in this whole crate; crate's own
#   description is "jsonnet and jrsonnet grammar for tree-sitter"). This
#   grammar generation has drifted completely from every node-kind name the
#   baseline's own `jsonnet_*` arrays list (`document`/`anonymous_function`/
#   `functioncall`/`conditional`/`local_bind` all do not exist -- the real
#   kinds are `source_file`/no-dedicated-function-node-at-all/
#   `suffix_apply`/`if_then_else`/`bind`) -- see `LangSpec::jsonnet`'s own
#   doc comment for the full corrections, including the real finding
#   (verified via THREE separate real parse-tree dumps of different
#   function-definition syntaxes) that this grammar never actually
#   produces the `function_expr` wrapper node its own `node-types.json`
#   lists as a legal child shape.
# - CFScript: NO new grammar dependency at all -- reuses this crate's
#   `tree-sitter-cfml` dependency (added just below) via that SAME
#   crate's separate `LANGUAGE_CFSCRIPT` export, mirroring the
#   `tree-sitter-typescript` crate's own TS/TSX-two-entry-points
#   precedent this crate already follows for `LangSpec::tsx`.
tree-sitter-bicep = "1.1"
tree-sitter-nickel = "0.5"
tree-sitter-jsonnet = "0.0.1"
# `cfmleditor/tree-sitter-cfml` -- bundles CFML/CFScript/CFQuery as THREE
