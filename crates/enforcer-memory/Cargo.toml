#   tree-sitter-crystal -- EXACT copyright-line match, "Gabriel Holodak",
#   against this crate's own vendored `internal/cbm/vendored/grammars/
#   crystal/LICENSE`, confirming this is the identical grammar lineage
#   the baseline itself vendored). This repository's own `Cargo.toml` is
