# COBOL: VENDORED, not a crates.io dependency at all -- see
# `crates/enforcer-memory/vendor/tree-sitter-cobol-local/` (a local
# path-dependency, added below). The crate literally named
# `tree-sitter-cobol` (0.1.0, published 2025-08-22) ships NO usable Rust
# API whatsoever -- confirmed by downloading and inspecting its published
# `Cargo.toml`/source directly: it declares only a `[[bin]]` target
# (`src/main.rs`), no `[lib]` section, and zero dependencies, so `cargo
# build` against it fails outright ("ignoring invalid dependency
# `tree-sitter-cobol` which is missing a lib target") -- a placeholder/
# reserved-name publish, not a real grammar binding, and the exact
# "unavailable" condition the language-parity campaign's own grammar-
# sourcing fallback order (crate -> vendor -> defer) exists for. The real
# grammar (`github.com/yutaro-sakamoto/tree-sitter-cobol`, unpublished to
# crates.io) has an EXACT `tree_sitter_COBOL` symbol match against the C
# baseline's own `lang_specs.c` reference (confirming identical grammar
# lineage), MIT-licensed (its own `Cargo.toml` `repository` field points
# at `github.com/tree-sitter/tree-sitter-COBOL`, the original, now-
# archived official `tree-sitter` org grammar, copyright Max Brunsfeld --
# tree-sitter's own creator). That repository's own `bindings/rust/lib.rs`
# hard-pins `tree-sitter = "~0.20.3"` as a normal (non-dev) dependency and
# returns a bare `tree_sitter::Language` typed against that old version --
# the SAME two-different-major-versions-of-`tree-sitter`-cannot-coexist
# incompatibility `tree_sitter_squirrel_local` (this workspace's other
# vendored grammar) already documents, not a new problem class -- so this
# crate re-vendors that repository's own `src/parser.c`/`src/scanner.c`/
# `src/node-types.json` (ABI 14, confirmed compatible with this
# workspace's `tree-sitter = "0.25"` core's 13-15 range) and binds them via
# `tree-sitter-language` instead (see
# `vendor/tree-sitter-cobol-local/src/lib.rs`'s own module doc for the
# full rationale). ONE portability fix beyond the binding swap (unlike
# Squirrel, which needed none): the vendored `scanner.c`'s
# `start_with_word` helper declared two local arrays as C99
# variable-length arrays (VLA) sized by a function PARAMETER -- valid
# under GCC/Clang but rejected outright by MSVC's `cl.exe` ("error C2057:
# expected constant expression"), confirmed via a real `cargo build`
# failure on this workspace's Windows/MSVC toolchain before the fix (the
# fix -- bounding both arrays to a small fixed size -- is documented
# inline at its own edit site in the vendored `scanner.c` and is
# behavior-preserving: the one real call site always passes the
# compile-time constant 9). Verified end-to-end (real parse, no ABI
# error, `has_error: false` on IDENTIFICATION/DATA/PROCEDURE DIVISION
# source including CALL, IF, EVALUATE, PERFORM, and COPY statements) with
# dedicated fixtures before being wired in.
tree-sitter-commonlisp = "0.4"
tree-sitter-lean4 = "0.3"
tree-sitter-tlaplus = "1.5"
tree-sitter-verilog = "1.0"
tree-sitter-vhdl = "1.4"
tree-sitter-systemverilog = "0.3"
tree-sitter-cobol-local = { path = "vendor/tree-sitter-cobol-local" }
