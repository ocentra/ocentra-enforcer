[package]
name = "enforcer-memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "x06: the harness memory graph. Ingests append-only NDJSON memory records (memory/schema/memory-record.schema.json) and the orchestration-lessons ledger into an in-process graph, exposes a local-first, zero-network recall/evidence query surface, and defines the usage-ingestion seam (ingest_observation) that scan/check/run/closeout surfaces call on every run. Embedding-backed retrieval is gated behind the optional `embeddings` feature (unimplemented placeholder trait only in this slice) so the crate builds and tests with zero model downloads; the default retriever is a deterministic keyword/domain matcher."
publish = false

[dependencies]
# DEPENDENCY-JUSTIFICATION: Memory records and recall responses use serde for
# stable wire encoding, thiserror for typed failures, and sha2 for deterministic
# content fingerprints.
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
# DEPENDENCY-JUSTIFICATION: The memory graph publishes the workspace's shared
# core contracts and branded domain values rather than duplicating them.
enforcer-core = { path = "../enforcer-core", version = "0.1.0" }
enforcer-domain = { path = "../enforcer-domain", version = "0.1.0" }
enforcer-syntax = { path = "../enforcer-syntax", version = "0.1.0" }
# DEPENDENCY-JUSTIFICATION: Optional model acquisition is deliberately opt-in;
# default memory retrieval remains local, deterministic, and network-free.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
ndarray = { version = "0.17", default-features = false, optional = true }
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs", "tracing", "tls-native", "api-24"], optional = true }
# DEPENDENCY-JUSTIFICATION: Optional ORT-backed retrieval needs a pure-Rust
# reader for Hugging Face tokenizer.json assets. rten-text implements the BPE,
# normalization, and pre-tokenization pipeline without tokenizers' unmaintained
# paste dependency or a native regex engine; no tokenizer is loaded by default.
rten-text = { version = "0.24.0", default-features = false, optional = true }
# SQLite operational graph/read model. `bundled` vendors and statically
# links SQLite's C sources at build time so the crate has zero system
# dependency (no "sqlite3.dll not found" on a bare Windows box).
# NATIVE-DEPENDENCY-JUSTIFICATION: Bundled SQLite makes the local read model
# reproducible on Windows without requiring a system SQLite DLL.
rusqlite = { version = "0.31", default-features = false, features = ["bundled"] }
# DuckDB analytics read model, OPT-IN ONLY. The `duckdb` crate's own
# `bundled` build compiles a large C++ amalgamation and has been
# unreliable/slow on Windows in this workspace's CI history; the default
# analytics read model is a deterministic in-process fallback
# (`store::analytics::InProcessAnalytics`) behind the `AnalyticsReadModel`
# trait, so `cargo build -p enforcer-memory` never requires a C++
# toolchain. Real DuckDB rides the same trait behind this feature -- see
# `src/store/analytics.rs` module docs for the full decision record.
# DEPENDENCY-JUSTIFICATION: DuckDB is an optional analytics backend behind the
# analytics read-model trait; it is never selected by the default feature set.
duckdb = { version = "1.10505.0", features = ["bundled"], optional = true }
# git2 (libgit2 bindings) over gix: X06.2 only needs read-only HEAD/log/
# blame-style metadata (last commit touching a path, commit count) --
# libgit2 is the more battle-tested, synchronous, blocking-call-friendly
# surface for exactly that, and every consumer in this workspace that
# will eventually shell into git tooling can treat it the same way. gix
# is the more "modern pure-Rust" choice but its porcelain surface for
# per-path history is still less complete than libgit2's revwalk, and we
# do not need gix's async/pure-Rust selling points for a local,
# synchronous, read-only indexer.
# DEPENDENCY-JUSTIFICATION: git2 supplies local, read-only repository history
# metadata to ingestion without shelling out or adding an async runtime.
git2 = "0.21"
# Consumer-side AST node/query types for the complexity walk; grammar providers remain syntax-owned.
tree-sitter = "0.25"
# DEPENDENCY-JUSTIFICATION: Graph algorithms operate on the memory graph's
# related-node and reverse-dependency edges; syntax parsing remains syntax-owned.
petgraph = "0.6"
tokio = { workspace = true, features = ["sync", "time", "test-util"] }
# DEPENDENCY-JUSTIFICATION: Existing memory ingestion and retrieval paths use
# regex for deterministic token and identifier matching.
regex = "=1.12.4"
# DEPENDENCY-JUSTIFICATION: Existing memory diagnostics and tool-facing
# observation paths use the workspace MCP contract.
enforcer-mcp = { version = "0.1.0", path = "../enforcer-mcp" }
# DEPENDENCY-JUSTIFICATION: Existing memory watcher support observes local
# repository changes without shelling out or adding a service dependency.
notify = "6.1.1"
# DEPENDENCY-JUSTIFICATION: Existing memory records use zstd for compact local
# evidence/archive payloads.
zstd = "0.13"
# DEPENDENCY-JUSTIFICATION: Existing memory signing and verification paths use
# Ed25519 with the workspace's standard-library/random-core features.
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std", "rand_core"] }
# DEPENDENCY-JUSTIFICATION: Existing memory signing uses OS-backed randomness
# through rand_core for key material and signature tests.
rand_core = { version = "0.6", features = ["getrandom"] }
[dev-dependencies]
# DEPENDENCY-JUSTIFICATION: Property tests generate adversarial parser inputs and
# prove every registered parser/normalizer contract remains total.
proptest = "1.7.0"
# DEPENDENCY-JUSTIFICATION: Integration tests create isolated temporary fixture
# repositories and filesystem state.
tempfile = "3.27.0"

[features]
default = []
# Opt-in seam for a future embedding-backed retriever (e.g. Qwen embeddings).
# No implementation ships in this slice -- the trait exists so callers can
# depend on the seam without pulling in any model runtime or network call.
embeddings = []
# Opt-in real DuckDB analytics backend. NOT part of `default` and NOT
# exercised by the gate in this pass -- see src/store/analytics.rs.
duckdb-analytics = ["duckdb"]
# X06 model-runtime harvest: real ORT-backed Qwen-class embedder/reranker
# contracts. NOT part of `default`; default gates stay deterministic,
# zero-network, and provider-unavailable unless explicitly enabled.
ort-models = ["dep:ndarray", "dep:ort", "dep:rten-text"]
# Explicit-network Hugging Face download/cache path. Never enabled by
# default; proof runners must opt in deliberately.
model-downloads = ["dep:reqwest"]
# Real local model proof path: cache/download helpers plus ORT inference.
real-models = ["model-downloads", "ort-models"]

[[bench]]
# X06.9 longitudinal benchmark SKELETON hook point
# (MEMORY_RETRIEVAL_QA_BENCHMARKS.md §3): index+query timing over a
# deterministic synthetic fixture repo. Plain `harness = false` bench
# (no criterion dev-dependency added in this pass -- see
# benches/x06_9_longitudinal.rs module docs for why).
name = "x06_9_longitudinal"
harness = false

[lints]
workspace = true
