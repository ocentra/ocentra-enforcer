[package]
name = "enforcer-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "x06: the harness memory graph. Ingests append-only NDJSON memory records (memory/schema/memory-record.schema.json) and the orchestration-lessons ledger into an in-process graph, exposes a local-first, zero-network recall/evidence query surface, and defines the usage-ingestion seam (ingest_observation) that scan/check/run/closeout surfaces call on every run. Embedding-backed retrieval is gated behind the optional `embeddings` feature (unimplemented placeholder trait only in this slice) so the crate builds and tests with zero model downloads; the default retriever is a deterministic keyword/domain matcher."
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
enforcer-core = { path = "../enforcer-core" }
enforcer-domain = { path = "../enforcer-domain" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
ndarray = { version = "0.17", default-features = false, optional = true }
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs", "tracing", "tls-native", "api-24"], optional = true }
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"], optional = true }
# SQLite operational graph/read model. `bundled` vendors and statically
# links SQLite's C sources at build time so the crate has zero system
# dependency (no "sqlite3.dll not found" on a bare Windows box).
rusqlite = { version = "0.31", features = ["bundled"] }
# DuckDB analytics read model, OPT-IN ONLY. The `duckdb` crate's own
# `bundled` build compiles a large C++ amalgamation and has been
# unreliable/slow on Windows in this workspace's CI history; the default
# analytics read model is a deterministic in-process fallback
# (`store::analytics::InProcessAnalytics`) behind the `AnalyticsReadModel`
# trait, so `cargo build -p enforcer-memory` never requires a C++
# toolchain. Real DuckDB rides the same trait behind this feature -- see
# `src/store/analytics.rs` module docs for the full decision record.
duckdb = { version = "1", features = ["bundled"], optional = true }
# git2 (libgit2 bindings) over gix: X06.2 only needs read-only HEAD/log/
# blame-style metadata (last commit touching a path, commit count) --
# libgit2 is the more battle-tested, synchronous, blocking-call-friendly
# surface for exactly that, and every consumer in this workspace that
# will eventually shell into git tooling can treat it the same way. gix
# is the more "modern pure-Rust" choice but its porcelain surface for
# per-path history is still less complete than libgit2's revwalk, and we
# do not need gix's async/pure-Rust selling points for a local,
# synchronous, read-only indexer.
git2 = "0.19"
# tree-sitter core + one grammar per required language (workpack X06.2:
# Rust, TypeScript/JavaScript, Python). Config/IaC (toml/json/yaml) and
# any other extension fall back to the TextOnly node path -- no grammar
# dependency needed for those.
#
# Bumped 0.24 -> 0.25 (lane x06-b3-csphp): the only crates.io release of
# tree-sitter-c-sharp (0.23.5) and tree-sitter-php (0.24.2) both ship a
# grammar ABI of 15 (regenerated with a newer tree-sitter-cli than their
# own crate version number suggests). `tree-sitter` core 0.24.x's
# `TREE_SITTER_LANGUAGE_VERSION` ceiling is 14, so `set_language` fails
# with `LanguageError { version: 15 }` for both grammars under 0.24.
# `tree-sitter` 0.25.x raises that ceiling to 15 while keeping
# `MIN_COMPATIBLE_LANGUAGE_VERSION` at 13, so every existing ABI-14
# grammar in this crate (rust/typescript/python/go/java, all pinned
# "0.23") keeps parsing unchanged -- this is a strict widening, not a
# breaking bump, verified by `cargo test -p enforcer-memory` (all
# pre-existing language unit tests green) after the bump.
tree-sitter = "0.25"
# petgraph: X06.3's graph-algorithms layer (related walk, call-path
# tracing, reverse dependency traversal, centrality/hotspot ranking)
# over CodeGraph. Approved per MEMORY_RETRIEVAL_BORROW_POLICY §2 (a
# TabAgentServer Cargo dependency CHOICE adopted directly) and
# MEMORY_RETRIEVAL_DECISIONS D-04 context ("prefer it for algorithms ...
# over hand-rolling"). Pure Rust, no C toolchain, matches this crate's
# zero-system-dependency posture.
petgraph = "0.6"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
# X06 wave-B core parity: Go/Java structural extractors (see
# languages/go.rs, languages/java.rs). Pinned to the same 0.23.x grammar
# ABI line as the wave-A grammars above (tree-sitter core "0.24").
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
# X06 wave-B core parity: C#/PHP structural extractors (see
# languages/csharp.rs, languages/php.rs). tree-sitter-c-sharp 0.23.x
# matches the same 0.23.x grammar ABI line as the other wave grammars
# above. tree-sitter-php 0.24.x exposes two grammar entry points --
# `LANGUAGE_PHP` (PHP-only, no leading `<?php` tag required) and
# `LANGUAGE_PHP_ONLY` is not a real symbol; the crate's actual exports
# are `LANGUAGE_PHP` (accepts inline HTML + `<?php ... ?>` tags, the
# real-world `.php` file shape) and `LANGUAGE_PHP_ONLY` (grammar rooted
# at `program` with no HTML/tag handling, for embedding PHP inside
# another host document). This extractor parses whole `.php` files as
# they exist on disk (inline HTML preamble/epilogue is common), so it
# uses `LANGUAGE_PHP` -- see `languages/php.rs` module doc.
tree-sitter-c-sharp = "0.23"
tree-sitter-php = "0.24"
# X06 wave-B core parity (lane x06-b2-ccpp): C/C++ structural extractors
# (see languages/c.rs, languages/cpp.rs). tree-sitter-c 0.24.x and
# tree-sitter-cpp 0.23.x are each the newest crates.io release that
# builds against this workspace's `tree-sitter = "0.24"` core.
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
# Language-parity wave G2.1a: Kotlin/Swift structural extractors (see
# languages/generic.rs's `parse_kotlin`/`parse_swift`). Neither crate
# depends on `tree-sitter` core as a runtime dependency at all -- both
# instead depend on `tree-sitter-language` (the same ABI-stable
# `LanguageFn` wrapper crate every other grammar here re-exports
# through, e.g. `tree_sitter_go::LANGUAGE.into()`), so pinning to this
# workspace's `tree-sitter = "0.25"` core carries no ABI risk regardless
# of which tree-sitter version either grammar crate itself was tested
# against. `tree-sitter-kotlin` (the older, non-"-ng" crates.io name,
# last published 2024-08) was rejected: it pins a hard `tree-sitter
# >=0.21, <0.23` RUNTIME dependency, which is incompatible with this
# workspace's core -- `tree-sitter-kotlin-ng` is the actively maintained
# fork (crates.io `repository` field points at
# `github.com/tree-sitter-grammars/tree-sitter-kotlin`, the same
# fwcd-authored grammar lineage vendored at
# `codebase-memory-mcp/internal/cbm/vendored/grammars/kotlin/`) that
# uses the safe `tree-sitter-language` shim instead.
tree-sitter-kotlin-ng = "1.1"
tree-sitter-swift = "0.7"
# Language-parity wave G2.1d: Solidity/GDScript structural extractors
# (see languages/generic.rs's `parse_solidity`/`parse_gdscript`). Both
# crates are actively maintained on crates.io and, like Kotlin/Swift
# above, depend on `tree-sitter-language` (not `tree-sitter` core) as
# their runtime binding, so pinning to this workspace's
# `tree-sitter = "0.25"` core carries no ABI risk: `tree-sitter-solidity`
# 1.2.13 generates ABI 15, `tree-sitter-gdscript` 6.1.0 generates ABI 14,
# both within `tree-sitter` 0.25's compatible range (13-15, see this
# file's own tree-sitter-c-sharp/tree-sitter-php comment above). Neither
# grammar is vendored from the baseline's
# `codebase-memory-mcp/internal/cbm/vendored/grammars/{solidity,gdscript}/`
# C sources: both crates' shipped `node-types.json` was cross-checked
# directly against every node kind/field name `languages/spec.rs`'s
# `LangSpec::solidity`/`LangSpec::gdscript` and `languages/generic.rs`'s
# corresponding quirks read, so there is no correctness reason to prefer
# the vendored copy over the maintained crate.
tree-sitter-solidity = "1.2"
tree-sitter-gdscript = "6"
# Language-parity wave G2.1b: Dart/Scala/Groovy structural extractors
# (see languages/generic.rs's `parse_dart`/`parse_scala`/`parse_groovy`).
# All three, like every grammar above, depend on `tree-sitter-language`
# (not `tree-sitter` core) as their runtime binding, so pinning to this
# workspace's `tree-sitter = "0.25"` core carries no ABI risk -- verified
# by an isolated `cargo build` against `tree-sitter = "0.25"` before
# adding these lines (all three compile clean).
# - `tree-sitter-dart` 0.2.0 (crates.io `repository`:
#   github.com/nielsenko/tree-sitter-dart, an actively maintained fork;
#   its own `src/node-types.json` was cross-checked directly against
#   every node kind `languages/spec.rs`'s `LangSpec::dart` and
#   `languages/generic.rs`'s `dart_quirk`/`dart_call_override` read --
#   several of the baseline's own `dart_*` arrays in
#   `codebase-memory-mcp/internal/cbm/lang_specs.c` are stale against
#   this grammar version (e.g. `class_definition` -> real kind is
#   `class_declaration`; `selector` -> real kind is `call_expression`;
#   `program` -> real root kind is `source_file`), corrected per
#   `LangSpec::dart`'s own doc comment rather than copied blindly.
# - `tree-sitter-scala` 0.26.0 (crates.io `repository`:
#   github.com/tree-sitter/tree-sitter-scala, the official
#   `tree-sitter` org grammar). Every baseline `scala_*` array matched
#   this grammar version exactly on cross-check -- no corrections
#   needed, see `LangSpec::scala`'s doc comment.
# - `tree-sitter-groovy` 0.1.2 (crates.io `repository`:
#   github.com/amaanq/tree-sitter-groovy). This grammar is considerably
#   more Java-shaped than the baseline's own `groovy_*` arrays assume
#   (e.g. class methods get their own distinct, Java-like
#   `method_declaration` node kind the baseline's flat array never
#   mentions at all -- omitting it would make every class method
#   invisible, not just imprecisely classified), corrected per
#   `LangSpec::groovy`'s own doc comment.
tree-sitter-dart = "0.2"
tree-sitter-scala = "0.26"
tree-sitter-groovy = "0.1"
# Language-parity wave G2.1c: Ruby/Zig/Objective-C structural extractors
# (see languages/generic.rs's `parse_ruby`/`parse_zig`/`parse_objc`).
# All three verified end-to-end (real parse, no ABI error) against this
# workspace's `tree-sitter = "0.25"` core before being added here.
# tree-sitter-ruby 0.23.1/tree-sitter-objc 3.0.2 both depend on
# `tree-sitter-language` (not `tree-sitter` core) as their runtime
# binding, same ABI-range-agnostic pattern as every grammar above;
# tree-sitter-zig 1.1.2's grammar happens to be ABI 15 (the newest
# generation, needing `tree-sitter` 0.25's raised ceiling) but binds
# through the identical `tree-sitter-language` mechanism. Every one of
# these three crates' shipped `node-types.json` was cross-checked
# directly against every node kind/field name `languages/spec.rs`'s
# `LangSpec::ruby`/`LangSpec::zig`/`LangSpec::objc` and
# `languages/generic.rs`'s corresponding quirks read -- see those doc
# comments for grammar-version drift found against the C baseline's own
# `ruby_*`/`zig_*`/`objc_*` arrays (e.g. Objective-C's
# `message_expression` has no `"selector"` field in this grammar
# version, unlike what `codebase-memory-mcp/internal/cbm/extract_calls.c`'s
# `extract_objc_callee` reads).
tree-sitter-ruby = "0.23"
tree-sitter-zig = "1"
tree-sitter-objc = "3"
# X06.4 (D-04, DEFAULT): pure-Rust HNSW vector index -- no C++ toolchain,
# no external vector service (qdrant-client is explicitly rejected, see
# MEMORY_RETRIEVAL_DECISIONS D-04). Harvested dependency choice from
# TabAgentServer Rust/indexing (BORROW_POLICY §2: "Cargo dependency
# CHOICES may be adopted directly").
hnsw_rs = "0.3"
# X06.5 weaver: event-driven enrichment queue + bounded-concurrency
# worker pool. The workspace's `tokio` entry only enables
# `rt-multi-thread`/`macros`; the weaver additionally needs `sync`
# (mpsc channels, Semaphore) and `time` (backoff sleeps), so this crate
# declares its own `tokio` with the fuller feature set rather than
# widening the workspace-wide default for every other crate.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
# X06.P1 `search_code`: graph-augmented grep needs a real regex engine
# (the mission's "regex/text over indexed file contents" requirement) --
# pure Rust, no C toolchain, matches this crate's zero-system-dependency
# posture (same bar as hnsw_rs/petgraph above). Not promoted to
# `[workspace.dependencies]` since no other crate in this workspace needs
# it yet; scoped here per this crate's existing pattern of crate-local
# deps (git2, tree-sitter, hnsw_rs are all declared the same way).
regex = "1"
# X06.7 MCP/CLI surface: reuses the arc-21 enforcer-mcp skeleton's pure
# I/O-free transport module (dual Content-Length/NDJSON framing +
# JSON-RPC message types) rather than re-implementing framing here --
# that module carries no business logic and does not pull this crate
# into arc-21's tool surface, stdio sink, or stale-write gate.
enforcer-mcp = { path = "../enforcer-mcp" }
# X06.7 (D-12, DEFAULT) filesystem watcher: native OS filesystem events
# (inotify/FSEvents/ReadDirectoryChangesW) as the primary signal, with an
# adaptive-polling fallback (src/watch.rs) for environments where native
# events are unreliable. Pure Rust, cross-platform, no C toolchain --
# matches this crate's zero-system-dependency posture.
notify = "6"
# X06.8 federation: bundle + graph-artifact compression for signed
# personal/team/community memory bundles and the D-11 `.codebase-memory/
# graph.db.zst` bootstrap artifact. Wraps the zstd C library via
# `zstd-sys` (matching the baseline's own `.zst` artifact format so
# parity fixtures stay byte-comparable in shape); this crate's OWN code
# stays free of `unsafe` per the workspace lints, which govern this
# crate's source, not its dependencies' internals.
zstd = "0.13"
# X06.8: detached ed25519 signatures over exported bundles -- zero-trust
# import verifies a bundle's signature against a local trust list before
# any content is read. Pure Rust, no C toolchain, `std` feature only (no
# `asm`/`pkcs8`/network extras needed for sign/verify over raw bytes;
# tests use fixed-seed `SigningKey::from_bytes`, so no RNG feature and
# no `rand_core` dependency either).
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
# Key generation for federation tests/fixtures (trust-list keypairs) --
# `getrandom` (not `std`) is what gates `rand_core::OsRng` in 0.6.x. Only
# used by `#[cfg(test)]` code and `tests/federation_roundtrip.rs`, but
# declared as a normal (not dev) dependency because `src/share.rs`'s and
# `src/federation.rs`'s own `#[cfg(test)]` modules are part of this
# crate's own compilation unit and need it too.
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
# tests/weaver_enrichment.rs hashes real fixture file content (rather
# than an inline synthetic string) to build realistic
# `WeaverEvent::{NodeChanged,FileChanged}` content hashes; integration
# tests are separate compilation units from the crate's own
# `[dependencies]`, so this must be declared again here even though the
# library already depends on `sha2`.
sha2 = { workspace = true }
# tests/federation_roundtrip.rs generates ed25519 keypairs the same way
# src/share.rs's and src/federation.rs's own unit tests do; same
# "integration tests are a separate compilation unit" reason as `sha2`
# above.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[features]
default = []
# Opt-in seam for a future embedding-backed retriever (e.g. Qwen embeddings).
# No implementation ships in this slice -- the trait exists so callers can
# depend on the seam without pulling in any model runtime or network call.
embeddings = []
# Opt-in real DuckDB analytics backend. NOT part of `default` and NOT
# exercised by the gate in this pass -- see src/store/analytics.rs.
duckdb-analytics = ["duckdb"]
# X06 model-runtime harvest: real ORT-backed Qwen-class embedder/reranker
# contracts. NOT part of `default`; default gates stay deterministic,
# zero-network, and provider-unavailable unless explicitly enabled.
ort-models = ["dep:ndarray", "dep:ort", "dep:tokenizers"]
# Explicit-network Hugging Face download/cache path. Never enabled by
# default; proof runners must opt in deliberately.
model-downloads = ["dep:reqwest"]
# Real local model proof path: cache/download helpers plus ORT inference.
real-models = ["model-downloads", "ort-models"]

[[bench]]
# X06.9 longitudinal benchmark SKELETON hook point
# (MEMORY_RETRIEVAL_QA_BENCHMARKS.md §3): index+query timing over a
# deterministic synthetic fixture repo. Plain `harness = false` bench
# (no criterion dev-dependency added in this pass -- see
# benches/x06_9_longitudinal.rs module docs for why).
name = "x06_9_longitudinal"
harness = false

[lints]
workspace = true
