# Language-parity wave G2.3b: COBOL/Common Lisp/Lean/TLA+/Verilog/VHDL/
# SystemVerilog structural extractors (see languages/generic.rs's
# `parse_cobol`/`parse_commonlisp`/`parse_lean`/`parse_tlaplus`/
# `parse_verilog`/`parse_vhdl`/`parse_systemverilog`). FORM (this wave's
# 8th assigned language) is DEFERRED -- no tree-sitter grammar exists for
# it anywhere: confirmed absent from crates.io (no `tree-sitter-form`/
# variant-spelling crate under any plausible name) AND from GitHub (an
# exhaustive repository search for "tree-sitter-form" returns only
# unrelated Rust-macro-formatting decoy repos, zero real FORM-language
# grammars) -- see `docs/plans/enforcer-selfhost-plan/language-parity/`
# wave report for the full finding; `LangSpec`/`Language`/dispatch rows
# for FORM are intentionally NOT added.
#
# All six real crates.io grammars below verified end-to-end (real parse,
# no ABI error, cross-checked against each crate's own `node-types.json`
# directly, not dump-only) against this workspace's `tree-sitter = "0.25"`
# core before being added:
# - `tree-sitter-commonlisp` 0.4.1 (crates.io `repository`:
#   github.com/theHamsta/tree-sitter-commonlisp). Depends on
#   `tree-sitter-language` (not `tree-sitter` core) as its runtime
#   binding, same ABI-range-agnostic pattern as every grammar above --
#   `tree-sitter = "0.25"` is only a `[dev-dependencies]` entry (its own
#   test suite). Exports `LANGUAGE_COMMONLISP` (NOT the plain `LANGUAGE`
#   const most other grammar crates here export). Every baseline
#   `commonlisp_*` array matched this grammar version exactly on
#   cross-check -- Lisp-family grammars are unusually uniform (see
#   `LangSpec::clojure`'s own doc comment for the same finding on a
#   different language), so unlike most G2 languages there was very
#   little for a grammar-version drift to land on here -- see
#   `LangSpec::commonlisp`'s own doc comment.
# - `tree-sitter-lean4` 0.3.0 (crates.io `repository`:
#   github.com/wvhulle/tree-sitter-lean, the maintained modern Lean 4
#   grammar). UNIQUELY among every grammar dependency in this crate,
#   exports a bare `pub fn language() -> tree_sitter::Language` (not the
#   `tree-sitter-language`/`LanguageFn`-returning shim every other
#   grammar crate here uses) -- but its own `Cargo.toml` declares
#   `tree-sitter = "0.25"` as a real NORMAL (non-dev) dependency, the
#   EXACT SAME version this workspace's own core pins, so there is no
#   ABI/dependency-graph risk despite the different binding shape (two
#   crates both depending on the identical `tree-sitter = "0.25"` line
#   share the same `tree_sitter::Language` type fine; the incompatibility
#   class that forced Squirrel/COBOL to be vendored only arises when the
#   VERSIONS genuinely differ). Baseline's own `lean_*` arrays needed
#   substantial correction against this grammar version -- see
#   `LangSpec::lean`'s own doc comment for the full findings, including a
#   real self-correction (structure/inductive are each their own
#   top-level node kind, not `[kind]`-field values on `definition` as a
#   too-quick first read of a parse-tree dump wrongly concluded, caught
#   and fixed against this crate's own `node-types.json` directly before
#   landing).
# - `tree-sitter-tlaplus` 1.5.0 (crates.io `repository`:
#   github.com/tlaplus-community/tree-sitter-tlaplus, the TLA+ community
#   org's own grammar). Depends on `tree-sitter-language` as its runtime
#   binding; `tree-sitter = "0.23"` is only a `[dev-dependencies]` entry.
#   Baseline's own `tlaplus_call_types` needed one correction (a bare
#   `"call"` array entry that DOES exist in this grammar's own
#   `node-types.json` but as an anonymous/unnamed token, not a real named
#   call-expression node) plus one real addition this row's own first
#   draft almost missed (`function_evaluation`, TLA+'s array-application
#   syntax, IS real and reachable, contrary to that first draft's
#   too-quick conclusion) -- see `LangSpec::tlaplus`'s own doc comment for
#   the full, self-corrected finding.
# - `tree-sitter-verilog` 1.0.3 (crates.io `repository`:
#   github.com/tree-sitter-grammars/tree-sitter-verilog). Depends on
#   `tree-sitter-language` as its runtime binding; `tree-sitter = "0.24"`
#   is only a `[dev-dependencies]` entry. Baseline's own `verilog_*`
#   arrays needed real correction, most notably a genuine, confirmed
#   grammar LIMITATION (not a baseline error): a user-defined function/
#   task call used as a bare top-level statement WITH parenthesized
#   arguments (`helper(1);`) is a real PARSE ERROR in this grammar
#   version, confirmed via a direct A/B test against
#   `tree-sitter-systemverilog` (which parses the identical form cleanly)
#   -- see `LangSpec::verilog`'s own doc comment for the full finding,
#   including a real correctness bug this row's own first draft almost
#   shipped (listing wrapper AND leaf call-node kinds together would have
#   triple-recorded the same call; caught and fixed against this crate's
#   own `node-types.json` before landing, not merely by inspection).
# - `tree-sitter-vhdl` 1.4.0 (crates.io `repository`:
#   github.com/teplyakovkonstantin/tree-sitter-vhdl). Depends on
#   `tree-sitter-language` as its runtime binding; `tree-sitter = "0.26.6"`
#   is only a `[dev-dependencies]` entry (a newer version than this
#   workspace's own `0.25` core pins, but the same ABI-range-agnostic
#   pattern applies since the runtime binding is the version-independent
#   shim, not `tree-sitter` core itself). Baseline's own VHDL arrays
#   confirmed the MOST accurate of this wave's HDL cluster -- see
#   `LangSpec::vhdl`'s own doc comment, including one genuine self-
#   correction (baseline's own `"function_call"`/
#   `"procedure_call_statement"` array entries turned out to be entirely
#   field-less wrappers with no callee of their own to record at all,
#   caught against this crate's own `node-types.json` directly, not a
#   dump-only spot-check, and fixed before landing).
# - `tree-sitter-systemverilog` 0.3.1 (crates.io `repository`:
#   github.com/tree-sitter-grammars/tree-sitter-systemverilog -- a
#   GENUINELY DIFFERENT, more modern grammar than plain
#   `tree-sitter-verilog` above, not a superset/reuse relationship the
#   way this crate's own CUDA/GLSL rows are of C++/C -- confirmed via
#   real parse-tree differences, not assumed from the language
#   relationship alone (e.g. real, direct `[name]` fields on
#   `class_declaration`/`module_declaration` that plain Verilog's own
#   grammar lacks). Depends on `tree-sitter-language` as its runtime
#   binding; `tree-sitter = "0.25.3"` is only a `[dev-dependencies]` entry.
