# nginx: legacy protocols enabled alongside modern ones
ssl_protocols SSLv3 TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;

# apache: SSLv2 hardened off, but TLSv1 and TLSv1.1 are still enabled
SSLProtocol all -SSLv2 +TLSv1 +TLSv1.1

# python: deprecated protocol-specific SSLContext constructors
context = ssl.SSLContext(ssl.PROTOCOL_TLSv1)
ctx2 = ssl.SSLContext(ssl.PROTOCOL_TLSv1_1)

# node.js: deprecated secureProtocol constant
const options = { secureProtocol: 'TLSv1_method' };

# generic client config: explicit legacy minVersion
const tlsOptions = { minVersion: "TLSv1" };

# explicit SSLv2 enable (no hardening prefix)
legacy_ctx = ssl.SSLContext(ssl.PROTOCOL_SSLv2)

# java: legacy protocol name requested directly
SSLContext.getInstance("SSLv3");
