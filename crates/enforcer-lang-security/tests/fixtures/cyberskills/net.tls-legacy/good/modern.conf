# nginx: modern-only protocol list
ssl_protocols TLSv1.2 TLSv1.3;

# apache: legacy protocols explicitly disabled (hardening), only 1.2/1.3 negotiable
SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1

# python: modern minimum-version enum, not a deprecated protocol-pinned constructor
ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT)
ctx.minimum_version = ssl.TLSVersion.TLSv1_2

# node.js: modern secureProtocol / minVersion
const options = { secureProtocol: 'TLSv1_2_method' };
const tlsOptions = { minVersion: "TLSv1.2" };

# java: modern protocol name requested directly
SSLContext.getInstance("TLSv1.3");
