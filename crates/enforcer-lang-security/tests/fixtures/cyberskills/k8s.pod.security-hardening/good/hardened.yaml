apiVersion: apps/v1
kind: Deployment
metadata:
  name: hardened
spec:
  template:
    spec:
      containers:
        - name: app
          image: nginx@sha256:abc
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
