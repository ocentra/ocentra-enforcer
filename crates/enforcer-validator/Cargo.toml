[package]
name = "enforcer-validator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The `Validator` trait plus the reusable fixture/parity harness: given a validator and its fail/pass fixtures, assert it fires on fail and stays silent on pass. Base crate every lang/security/literal-scan validator family builds on."
publish = false

[dependencies]
thiserror = { workspace = true }
# DEPENDENCY-JUSTIFICATION: fixture parity uses canonical filesystem and execution primitives.
# DEPENDENCY-JUSTIFICATION: validator inputs, findings, paths, identifiers, and errors use canonical domain values.
enforcer-domain = { path = "../enforcer-domain", version = "0.1.0" }
# DEPENDENCY-JUSTIFICATION: doc-rule parity resolves citations against the typed rule registry.
enforcer-rules = { path = "../enforcer-rules", version = "0.1.0" }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
