[package]
name = "enforcer-rules"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Structured rule registry (rules-as-data) for the Ocentra Enforcer workspace: typed rule records loaded from JSON, id/validator/fixtures/doc-anchor/tier linkage, and rule-version-drift detection."
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# DEPENDENCY-JUSTIFICATION: The registry loads rule records with shared
# decode/error contracts and preserves branded domain identifiers and tiers.
enforcer-core = { path = "../enforcer-core", version = "0.1.0" }
enforcer-domain = { path = "../enforcer-domain", version = "0.1.0" }
# DEPENDENCY-JUSTIFICATION: Rule records name the configured enforcement
# substrate without reimplementing policy parsing in this data crate.
enforcer-config = { path = "../enforcer-config", version = "0.1.0" }

[dev-dependencies]
# DEPENDENCY-JUSTIFICATION: property tests exercise strict JSON boundary
# decoding across generated whitespace and unknown-field inputs.
proptest = "1.9.0"
# DEPENDENCY-JUSTIFICATION: the UL00 inventory test reads parser identities
# only through the canonical generated syntax registry, never another source.
enforcer-syntax = { path = "../enforcer-syntax", version = "0.1.0" }
# DEPENDENCY-JUSTIFICATION: CyberSkills attribution tests fingerprint the
# checked-in vendor source before permitting a native rule mapping.
sha2 = { workspace = true }

[lints]
workspace = true
