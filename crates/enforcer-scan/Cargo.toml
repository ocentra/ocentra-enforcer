[package]
name = "enforcer-scan"
version.workspace = true
edition.workspace = true
rust-version = "1.82"
license.workspace = true
repository.workspace = true
description = "Parallel scan engine (rayon fan-out) + detect-and-route router (f05) + scan modes (f01) unifying every landed language-family Validator (arc-06..12), the scored literal scanner (arc-13), and d02's baseline-ratchet into one enforcer-domain Report surface. Tri-modal scope resolver (paths | base..head diff | --all), ignored-segments walk, and an idempotency guard (deterministic ordering; parallel==serial) round out the engine skeleton."
publish = false

[dependencies]
# DEPENDENCY-JUSTIFICATION: Structured findings, JSON boundaries, parallel work, and hashing are scan-engine primitives.
serde = { workspace = true }
serde_json = { workspace = true }
rayon = { workspace = true }
sha2 = { workspace = true }
# DEPENDENCY-JUSTIFICATION: Crate-scoped routing must read the typed Cargo package table rather than depend on source formatting.
toml_edit = { workspace = true }
# DEPENDENCY-JUSTIFICATION: Runtime literal policy stores reviewed regex allow patterns; native compilation is required to preserve their exact semantics.
regex = "=1.12.4"
# DEPENDENCY-JUSTIFICATION: TypeScript declarations mirror scan-facing typed records at the UI boundary.
ts-rs = { workspace = true }
enforcer-core = { path = "../enforcer-core", version = "0.1.0" }
enforcer-domain = { path = "../enforcer-domain", version = "0.1.0" }
enforcer-config = { path = "../enforcer-config", version = "0.1.0" }
# DEPENDENCY-JUSTIFICATION: Canonical identity routing consumes the typed registry metadata and precedence projection.
enforcer-syntax = { path = "../enforcer-syntax", version = "0.1.0" }
# DEPENDENCY-JUSTIFICATION: Validator dispatch and event records form the scan engine's typed execution contract.
enforcer-validator = { path = "../enforcer-validator", version = "0.1.0" }
enforcer-events = { path = "../enforcer-events", version = "0.1.0" }
enforcer-lang-common = { path = "../enforcer-lang-common", version = "0.1.0" }
enforcer-lang-rust = { path = "../enforcer-lang-rust", version = "0.1.0" }
# DEPENDENCY-JUSTIFICATION: Language-family validators are dispatched through this central scan engine.
enforcer-lang-ts = { path = "../enforcer-lang-ts", version = "0.1.0" }
enforcer-lang-py = { path = "../enforcer-lang-py", version = "0.1.0" }
# DEPENDENCY-JUSTIFICATION: Existing Dart validators are dispatched by the central scan engine.
enforcer-lang-dart = { path = "../enforcer-lang-dart", version = "0.1.0" }
enforcer-lang-security = { path = "../enforcer-lang-security", version = "0.1.0" }
enforcer-lang-iac = { path = "../enforcer-lang-iac", version = "0.1.0" }
# DEPENDENCY-JUSTIFICATION: Kubernetes and literal-risk validators participate in routed scan reports.
enforcer-lang-k8s = { path = "../enforcer-lang-k8s", version = "0.1.0" }
enforcer-literal-scan = { path = "../enforcer-literal-scan", version = "0.1.0" }

[dev-dependencies]
# DEPENDENCY-JUSTIFICATION: Filesystem fixtures and rule-registry checks exercise scan behavior in isolation.
tempfile = "3.27.0"
enforcer-rules = { path = "../enforcer-rules", version = "0.1.0" }

[lints]
workspace = true
