[package]
name = "tree-sitter-gotemplate-local"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = """
Vendored Go Template tree-sitter grammar (language-parity wave
G2.4e). Not published; local path-dependency only. See src/lib.rs
for why.
"""

[lib]
path = "src/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1"
