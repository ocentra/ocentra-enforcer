[package]
name = "tree-sitter-pine-local"
version = "0.1.0"
edition = "2021"
license = "ISC"
publish = false
description = """
Vendored Pine (TradingView Pine Script) tree-sitter grammar
(language-parity wave G2.4e). Not published; local path-dependency
only. See src/lib.rs for why.
"""

[lib]
path = "src/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1"
