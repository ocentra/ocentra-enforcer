[package]
name = "enforcer-syntax"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared language classification, grammar providers, safe parser boundaries, and normalized syntax extraction."
publish = false

[dependencies]
# The syntax boundary emits the shared, serialization-free memory facts used by
# graph and enforcement consumers. Grammar bindings are kept here so consumers
# do not inherit memory persistence, retrieval, or model dependencies.
# DEPENDENCY-JUSTIFICATION: UL03 moved this binding from enforcer-memory so grammar and parser ownership is centralized in the syntax boundary.
enforcer-domain = { path = "../enforcer-domain", version = "0.1.0" }
