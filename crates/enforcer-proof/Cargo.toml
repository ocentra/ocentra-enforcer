[package]
name = "enforcer-proof"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust proof harness (arc-17): routed proofs, artifact capture, freshness, PR-ready claims, an append-only SHA-256 hash-chained NDJSON journal (verify-on-open + on-replay), the rich proof envelope (git-state/in-toto/retention), and a legacy-artifact import path. Consumes enforcer-core's NdjsonWriter<T> sink + hash-chain primitive + two-layer redaction; does not reimplement them."
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# DEPENDENCY-JUSTIFICATION: serialize proof journal verification plus append across processes.
fs2 = { workspace = true }
# DEPENDENCY-JUSTIFICATION: shared execution and domain contracts required
# to capture and verify durable proof artifacts.
enforcer-core = { path = "../enforcer-core", version = "0.1.0" }
enforcer-domain = { path = "../enforcer-domain", version = "0.1.0" }
# DEPENDENCY-JUSTIFICATION: Proof commands share the harness-owned bounded process-tree executor while retaining proof-owned persistence.
enforcer-harness = { path = "../enforcer-harness", version = "0.1.0" }

[dev-dependencies]
# DEPENDENCY-JUSTIFICATION: isolated filesystem fixtures for proof artifact
# capture, freshness, and journal verification tests.
tempfile = "=3.27.0"

[lints]
workspace = true
