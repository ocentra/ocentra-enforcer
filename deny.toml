[advisories]
unmaintained = "deny"
yanked = "deny"
ignore = [
  # D-15 tokenizer policy: Hugging Face tokenizers 0.23.1 is the current
  # maintained tokenizer backend required by the opt-in ORT model path.
  # Its latest release still depends on paste; this narrow exception must
  # be removed when tokenizers publishes a paste-free release or when this
  # crate replaces tokenizers with an equivalent maintained backend.
  "RUSTSEC-2024-0436",
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0"
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
